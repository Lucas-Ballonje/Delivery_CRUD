spring.application.name=sistema-entregas
server.port=8080

# Banco SQLite (arquivo criado automaticamente na raiz do projeto)
spring.datasource.url=jdbc:sqlite:pedidos.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Rate limit (requisicoes por IP)
ratelimit.max-requests=20
ratelimit.window-seconds=60
